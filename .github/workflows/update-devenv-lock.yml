name: Update devenv.lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-devenv-lock
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Update devenv.lock
        run: devenv update

      - name: Verify environment
        run: devenv test

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-devenv-lock
          delete-branch: true
          commit-message: "chore(deps): update devenv.lock"
          title: "chore(deps): update devenv.lock"
          body: Automated update of `devenv.lock` via `devenv update`.
          labels: dependencies

      # main has no branch protection, and CI doesn't run on a PR opened with
      # GITHUB_TOKEN, so there is nothing to wait for: `devenv test` above is
      # the check. Merge right away.
      - name: Merge
        id: merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      # A push made with GITHUB_TOKEN doesn't trigger workflows, but a dispatch
      # does: run CI on main so it tests and publishes the new image.
      - name: Run CI on main
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
