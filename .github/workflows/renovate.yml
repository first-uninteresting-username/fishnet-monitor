name: Renovate

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.8
        with:
          # Needs a token that can push branches and open PRs, and whose PRs
          # trigger workflows (GITHUB_TOKEN's don't). See README.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # renovate.json5 in the repo is the only config; no onboarding PR.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # postUpgradeTasks only run commands matched here. This is the one
          # command renovate.json5 uses to refresh frontend/vendor.lock.
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/vendor-frontend\\.sh --update$"]'
