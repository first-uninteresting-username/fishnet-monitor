name: Refresh vendored frontend

# Renovate bumps versions in frontend/vendor.lock but can't run commands. This
# finishes the job on its PRs: refresh the sums and vendored files, rebuild the
# generated stylesheet (it inlines vendor/uplot.css), and push the result onto
# the PR branch, then run CI on it (see the last step).

on:
  pull_request:
    paths:
      - frontend/vendor.lock

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-vendored-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    # Only Renovate's own branches in this repository: fork PRs get no write
    # token, and a human's edit to the lock should be refreshed by hand.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Refresh sums and vendored files
        run: bash scripts/vendor-frontend.sh --update

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # Same Tailwind as local development (pinned by devenv.lock).
      - name: Rebuild frontend/styles.css
        run: devenv shell -- build-css

      - name: Commit and push
        id: commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add frontend/vendor.lock frontend/vendor frontend/styles.css
          if git diff --cached --quiet; then
            echo "Nothing to refresh."
            exit 0
          fi
          # This author is listed in gitIgnoredAuthors (renovate.json5), so
          # Renovate doesn't treat the PR as hand-edited and keeps rebasing it.
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(deps): refresh vendored frontend files"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >>"$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN doesn't trigger workflows, so CI wouldn't
      # run on the new commit and Renovate, finding no checks, wouldn't
      # automerge the PR. A dispatch does trigger them, and its checks land on
      # the branch's head commit.
      - name: Run CI on the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
